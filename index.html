<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MKYBD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3.9">
</head>
<body>
    <!-- 動的カラーマトリクスフィルタ用コンテナ -->
    <svg id="svg-filters" style="display:none;"></svg>
    <div class="app-container">
        <!-- 表示エリア (グリッド/テキストエリア) -->
        <div class="display-wrapper" id="displayWrapper">
            <div class="display-area" id="displayArea">
                <!-- 行ごとのテキストがここに動的に生成される -->
            </div>
        </div>

        <!-- 変換候補バー -->
        <div class="candidate-bar" id="candidateBar"></div>

        <!-- キーボードエリア -->
        <div class="keyboard-container" id="keyboardContainer">
            <!-- JavaScriptで動的にキーボードが生成される -->
        </div>

        <!-- メニューポップアップ -->
        <div class="modal-overlay" id="menuModal">
            <div class="menu-dialog">
                <div class="menu-title">MENU</div>
                <div class="menu-buttons">
                    <button class="menu-btn" id="btnCopy">Copy</button>
                    <button class="menu-btn" id="btnPaste">Paste</button>
                    <button class="menu-btn" id="btnPush">Push Memo</button>
                    <button class="menu-btn" id="btnPop">Pop Memo</button>
                    <button class="menu-btn" id="btnSave">Save</button>
                    <button class="menu-btn" id="btnClear">Clear</button>
                </div>
            </div>
        </div>

        <!-- Pop一覧ダイアログ -->
        <div class="modal-overlay" id="popModal">
            <div class="pop-dialog">
                <div class="pop-title">Memo</div>
                <div class="journal-list-container" id="journalList">
                    <!-- 動的に読み込まれる -->
                </div>
                <div class="pop-buttons">
                    <button class="pop-btn disabled" id="btnPopExecute" disabled>Pop</button>
                    <button class="pop-btn" id="btnPopExport">Export</button>
                    <button class="pop-btn disabled" id="btnPopDelete" disabled>Delete</button>
                </div>
            </div>
        </div>

        <!-- クリア確認ポップアップ -->
        <div class="modal-overlay" id="confirmModal">
            <div class="confirm-dialog">
                <div class="confirm-title" id="confirmTitle">Clear all text?</div>
                <div class="confirm-buttons">
                    <button class="confirm-btn yes" id="btnYes">Yes</button>
                    <button class="confirm-btn no" id="btnNo">No</button>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
